version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pos_postgres
    environment:
      POSTGRES_USER: pos_admin
      POSTGRES_PASSWORD: pos_password
      POSTGRES_DB: pos_saas
    ports:
      - "5433:5432"
    volumes:
      - pos_postgres_data_v2:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pos_redis
    ports:
      - "6379:6379"
    volumes:
      - pos_redis_data_v2:/data
    restart: unless-stopped

volumes:
  pos_postgres_data_v2:
  pos_redis_data_v2:
